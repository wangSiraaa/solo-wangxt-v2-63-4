components:
  schemas:
    AttributionCorrection:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        proposal:
          type: integer
          readOnly: true
          title: 修订提案
        impact_item:
          type: integer
          readOnly: true
          title: 影响项
        penalty:
          type: integer
          readOnly: true
          title: 处罚单元
        version:
          type: integer
          readOnly: true
          title: 追加的归属版本
        from_contract:
          type: integer
          readOnly: true
          nullable: true
          title: 更正前合同（保留）
        from_contractor_name:
          type: string
          readOnly: true
          title: 更正前承包商（保留快照）
        to_contract:
          type: integer
          readOnly: true
          nullable: true
          title: 应归合同
        to_contractor_name:
          type: string
          readOnly: true
          title: 应归承包商
        actor:
          type: string
          readOnly: true
          title: 操作人
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
      required:
      - actor
      - created_at
      - from_contract
      - from_contractor_name
      - id
      - impact_item
      - penalty
      - proposal
      - to_contract
      - to_contractor_name
      - version
    CandidateStatusEnum:
      enum:
      - pending
      - confirmed_duplicate
      - recurrence
      - different
      - rejected
      type: string
      description: |-
        * `pending` - 待判定
        * `confirmed_duplicate` - 确认同问题（挂接，不重复扣分）
        * `recurrence` - 整改后复发（新建事件）
        * `different` - 不同地点/不同问题（不合并）
        * `rejected` - 误报忽略
    CleaningContract:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          title: 合同编号
          maxLength: 32
        grid:
          type: integer
          title: 道路网格
        contractor_name:
          type: string
          title: 承包商名称
          maxLength: 128
        valid_from:
          type: string
          format: date-time
          title: 责任开始时间（含）
        valid_to:
          type: string
          format: date-time
          title: 责任结束时间（不含）
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
      required:
      - code
      - contractor_name
      - created_at
      - grid
      - id
      - valid_from
      - valid_to
    ContractHistory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        contract:
          type: integer
          readOnly: true
          title: 保洁合同
        grid:
          type: integer
          readOnly: true
          title: 网格快照
        code:
          type: string
          readOnly: true
          title: 合同编号快照
        contractor_name:
          type: string
          readOnly: true
          title: 承包商名称快照
        valid_from:
          type: string
          format: date-time
          readOnly: true
          title: 责任开始时间快照（含）
        valid_to:
          type: string
          format: date-time
          readOnly: true
          title: 责任结束时间快照（不含）
        revision:
          type: integer
          readOnly: true
          nullable: true
          title: 发布该快照的修订（NULL=迁移基线）
        published_at:
          type: string
          format: date-time
          readOnly: true
          title: 发布时间
      required:
      - code
      - contract
      - contractor_name
      - grid
      - id
      - published_at
      - revision
      - valid_from
      - valid_to
    DuplicateCandidate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        photo:
          allOf:
          - $ref: '#/components/schemas/PhotoBrief'
          readOnly: true
        matched_photo:
          allOf:
          - $ref: '#/components/schemas/PhotoBrief'
          readOnly: true
        hamming_distance:
          type: integer
          readOnly: true
          title: PHash汉明距离
        status:
          allOf:
          - $ref: '#/components/schemas/CandidateStatusEnum'
          readOnly: true
          title: 判定状态
        status_display:
          type: string
          readOnly: true
        decision_note:
          type: string
          readOnly: true
          title: 判定说明
        decided_by:
          type: string
          readOnly: true
          title: 判定人
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: 判定时间
      required:
      - decided_at
      - decided_by
      - decision_note
      - hamming_distance
      - id
      - matched_photo
      - photo
      - status
      - status_display
    EscalationRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        penalty:
          type: integer
          readOnly: true
          title: 处罚单元
        level:
          type: integer
          readOnly: true
          title: 升级到等级
        version:
          type: integer
          readOnly: true
          title: 产生的处罚版本
        reason:
          type: string
          readOnly: true
          title: 升级原因
        actor:
          type: string
          readOnly: true
          title: 执行任务
        ran_at:
          type: string
          format: date-time
          readOnly: true
          title: 执行时间(注入时钟)
      required:
      - actor
      - id
      - level
      - penalty
      - ran_at
      - reason
      - version
    EventBrief:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event_no:
          type: string
          readOnly: true
          title: 事件编号
        category:
          allOf:
          - $ref: '#/components/schemas/EventCategoryEnum'
          title: 问题类别
        status:
          allOf:
          - $ref: '#/components/schemas/EventStatusEnum'
          title: 状态
        location:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: float
              example:
              - 12.9721
              - 77.5933
              minItems: 2
              maxItems: 3
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          title: 发生/拍摄时间
          description: 归属与 SLA 都以该时间为准，而不是录入时间
        grid:
          type: integer
          nullable: true
          title: 所在网格
        contractor_name:
          type: string
          title: 责任承包商快照
          maxLength: 128
      required:
      - category
      - event_no
      - id
      - location
      - occurred_at
    EventCategoryEnum:
      enum:
      - litter
      - overflow
      - road_dirt
      - dead_corner
      - other
      type: string
      description: |-
        * `litter` - 散落垃圾
        * `overflow` - 垃圾桶满溢
        * `road_dirt` - 路面污渍
        * `dead_corner` - 卫生死角
        * `other` - 其他问题
    EventStatusEnum:
      enum:
      - open
      - rectified
      type: string
      description: |-
        * `open` - 待整改
        * `rectified` - 已整改
    EvidencePhoto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
          title: 图片文件
        phash:
          type: string
          readOnly: true
          title: 感知哈希(hex)
        captured_at:
          type: string
          format: date-time
          title: 拍摄时间
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          writeOnly: true
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          writeOnly: true
        location:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: float
              example:
              - 12.9721
              - 77.5933
              minItems: 2
              maxItems: 3
          readOnly: true
        uploader:
          type: string
          title: 上传人
          maxLength: 64
        note:
          type: string
          title: 备注
          maxLength: 256
        event:
          type: integer
          readOnly: true
          nullable: true
          title: 关联事件
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
      required:
      - captured_at
      - created_at
      - event
      - id
      - image
      - lat
      - lng
      - location
      - phash
