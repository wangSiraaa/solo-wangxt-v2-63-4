  /api/candidates/:
    get:
      operationId: candidates_list
      description: 疑似重复候选：只读列表 + 人工判定动作。
      parameters:
      - in: query
        name: matched_photo
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - in: query
        name: photo
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          title: 判定状态
          enum:
          - confirmed_duplicate
          - different
          - pending
          - recurrence
          - rejected
        description: |-
          * `pending` - 待判定
          * `confirmed_duplicate` - 确认同问题（挂接，不重复扣分）
          * `recurrence` - 整改后复发（新建事件）
          * `different` - 不同地点/不同问题（不合并）
          * `rejected` - 误报忽略
      tags:
      - candidates
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDuplicateCandidateList'
          description: ''
  /api/candidates/{id}/:
    get:
