openapi: 3.0.3
info:
  title: 街道环卫考核 API
  version: 1.0.0
  description: |-
    道路网格 / 保洁合同 / 问题事件 / 证据照片 / 处罚单元管理。

    核心规则：
    * 照片感知哈希(pHash)只用于生成**疑似重复候选**，是否同一问题由人工结合位置、时间判断；
    * 同一问题不同角度拍摄只计扣一次（照片挂接到已有事件）；
    * 已整改后同一位置复发 = 新事件、新处罚；
    * 扣分归属按**事件发生时**的合同责任区间，与录入时间无关；
    * 逾期升级基于可注入时钟；复核通过锁定处罚版本，更正只能追加新版本；
    * 网格/合同登记错误通过**修订提案**追溯更正：带基准快照与有效时间，经冲突校验、影响预览、确认发布；历史 append-only，不覆盖按发生时归属；
    * 同一时空区间不得有两个责任归属；命中未锁定事件确认后才改挂，命中已锁定处罚保留原快照并追加 attribution 版本+审计链。
paths:
  /api/attribution-corrections/:
    get:
      operationId: attribution_corrections_list
      description: 命中锁定处罚的归属更正审计链（只读）。
